apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-didauth-k8s
  annotations:
    policies.kyverno.io/title: Require DIDAuth-K8s credentials
    policies.kyverno.io/category: Software Supply Chain Security
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-digest-pinned-images
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "Every container image must be pinned by an OCI sha256 digest."
        foreach:
          - list: "request.object.spec.[initContainers, ephemeralContainers, containers][]"
            pattern:
              image: "*@sha256:*"
