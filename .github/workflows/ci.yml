name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts-hardhat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - name: Cache solc compiler
        uses: actions/cache@v3
        with:
          path: ~/.cache/hardhat-nodejs/compilers
          key: ${{ runner.os }}-solc-0.8.21
      - run: npx hardhat compile
      - run: npx hardhat test --no-compile

  build-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.21
      - run: go build ./...
        working-directory: go-admission

  build-and-push:
    needs: build-go
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ github.repository }}/go-admission
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: go-admission
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:latest

  deploy-contract:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test-contracts
    defaults:
      run:
        working-directory: contracts-hardhat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npx hardhat run scripts/deploy.js --network arbitrumSepolia
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
