name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts-hardhat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Cache solc compiler
        uses: actions/cache@v4
        with:
          path: ~/.cache/hardhat-nodejs/compilers
          key: ${{ runner.os }}-solc-0.8.28
      - run: npx hardhat compile
      - run: npx hardhat test --no-compile

  build-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go build ./...
        working-directory: k8s-webhook

  build-issuer-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: issuer-api
          push: false

  build-and-push:
    needs: build-go
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase image name
        # ghcr.io tags must be all-lowercase; github.repository preserves
        # the repo's actual case (DIDAuth-Docker), which docker/build-push
        # rejects outright ("repository name must be lowercase").
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}/vc-webhook' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: k8s-webhook
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:latest

  deploy-contract:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test-contracts
    defaults:
      run:
        working-directory: contracts-hardhat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx hardhat run scripts/deploy.ts --network arbitrumSepolia
        env:
          ARBITRUM_SEPOLIA_RPC: ${{ secrets.RPC_URL }}
          DEPLOYER_PK: ${{ secrets.PRIVATE_KEY }}
